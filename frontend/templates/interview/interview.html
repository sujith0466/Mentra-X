{% extends "base.html" %}

{% block title %}Mock Interview{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <!-- Main Interview Area -->
        <div class="col-lg-8 mx-auto">
            <div id="errorAlert" class="alert alert-danger d-none"></div>

            <div class="card shadow-sm" id="interviewCard">
                <div class="card-header interview-card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-primary">Mock Interview</h5>
                    <span id="questionCounter" class="badge bg-secondary">Question 1 of ?</span>
                </div>
                
                <div class="card-body p-4">
                    <div class="mb-2">
                        <span id="questionTypeBadge" class="badge interview-type-badge mb-2">Technical</span>
                    </div>
                    <h4 id="questionText" class="mb-4">Loading question...</h4>
                    
                    <form id="answerForm">
                        <div class="mb-3">
                            <label for="answerTextarea" class="form-label text-muted">Your Answer</label>
                            <textarea class="form-control mb-3" id="answerTextarea" rows="6" placeholder="Type your answer here..." required></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                Submit Answer
                            </button>
                            
                            <div id="loadingIndicator" class="mt-2 d-none">
                                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                Evaluator AI thinking...
                            </div>
                        </div>
                    </form>
                    
                    <!-- Feedback Section (Hidden initially) -->
                    <div id="feedbackSection" class="mt-4 p-3 interview-feedback rounded d-none border-start border-4 border-success">
                        <h5 class="font-weight-bold text-success mb-2">Evaluation Results</h5>
                        <p class="mb-1"><strong>Score:</strong> <span id="scoreText" class="badge bg-success fs-6">0/10</span></p>
                        <p class="mb-1"><strong>Feedback:</strong> <span id="feedbackText"></span></p>
                        <p class="mb-3"><strong>Area to Improve:</strong> <span id="improvementText" class="text-danger"></span></p>
                        
                        <button type="button" class="btn btn-outline-primary" id="nextBtn">
                            Next Question →
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // State management
    const questionsRaw = sessionStorage.getItem('interview_questions');
    if (!questionsRaw) {
        window.location.href = 'start.html';  // Fallback
        return;
    }
    
    const questions = JSON.parse(questionsRaw);
    const totalQuestions = parseInt(sessionStorage.getItem('interview_total')) || questions.length;
    let currentIndex = parseInt(sessionStorage.getItem('interview_current_index')) || 0;
    
    // UI Elements
    const qText = document.getElementById('questionText');
    const qTypeBadge = document.getElementById('questionTypeBadge');
    const qCounter = document.getElementById('questionCounter');
    
    const answerForm = document.getElementById('answerForm');
    const answerTextarea = document.getElementById('answerTextarea');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loadingIndicator');
    
    const feedbackSection = document.getElementById('feedbackSection');
    const scoreText = document.getElementById('scoreText');
    const feedbackText = document.getElementById('feedbackText');
    const improvementText = document.getElementById('improvementText');
    const nextBtn = document.getElementById('nextBtn');
    
    const errorAlert = document.getElementById('errorAlert');
    
    function loadCurrentQuestion() {
        if (currentIndex >= totalQuestions) {
            finishInterview();
            return;
        }
        
        // Reset UI
        const q = questions[currentIndex];
        qText.innerText = q.question;
        qTypeBadge.innerText = q.type.toUpperCase();
        qCounter.innerText = `Question ${currentIndex + 1} of ${totalQuestions}`;
        
        answerTextarea.value = '';
        answerTextarea.disabled = false;
        
        feedbackSection.classList.add('d-none');
        submitBtn.classList.remove('d-none');
        submitBtn.disabled = false;
        
        if (currentIndex === totalQuestions - 1) {
            nextBtn.innerText = "Complete Interview";
            nextBtn.classList.remove('btn-outline-primary');
            nextBtn.classList.add('btn-success');
        }
    }
    
    async function submitAnswer(answer) {
        submitBtn.disabled = true;
        loading.classList.remove('d-none');
        errorAlert.classList.add('d-none');
        answerTextarea.disabled = true;
        
        try {
            const resp = await fetch('/api/interview/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question_index: currentIndex,
                    answer: answer
                })
            });
            const data = await resp.json();
            
            if (data.status === 'success') {
                const res = data.result;
                scoreText.innerText = `${res.score}/10`;
                scoreText.className = `badge fs-6 ${res.score >= 7 ? 'bg-success' : res.score >= 4 ? 'bg-warning' : 'bg-danger'}`;
                
                feedbackText.innerText = res.feedback;
                improvementText.innerText = res.improvement;
                
                submitBtn.classList.add('d-none');
                feedbackSection.classList.remove('d-none');
            } else {
                showError(data.message || "Session error occurred.");
            }
        } catch (err) {
            showError("Network error evaluating answer.");
        } finally {
            loading.classList.add('d-none');
        }
    }
    
    async function finishInterview() {
        try {
            const resp = await fetch('/api/interview/complete', { method: 'POST' });
            const data = await resp.json();
            if (data.status === 'success') {
                sessionStorage.setItem('interview_summary', JSON.stringify(data.summary));
                window.location.href = 'result.html';
            } else {
                showError(data.message);
            }
        } catch (err) {
            showError("Network error completing interview.");
        }
    }
    
    function showError(msg) {
        errorAlert.innerText = msg;
        errorAlert.classList.remove('d-none');
        answerTextarea.disabled = false;
        submitBtn.disabled = false;
    }
    
    // Bind Events
    answerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const ans = answerTextarea.value.trim();
        if (ans) {
            submitAnswer(ans);
        }
    });
    
    nextBtn.addEventListener('click', () => {
        currentIndex++;
        sessionStorage.setItem('interview_current_index', currentIndex.toString());
        loadCurrentQuestion();
    });
    
    // Start
    loadCurrentQuestion();
});
</script>
<style>
.interview-card-header {
    background: var(--surface);
    color: var(--text);
}
.interview-type-badge {
    background: var(--surface-light);
    color: var(--text);
    border: 1px solid var(--border);
}
.interview-feedback {
    background: var(--surface-light);
    color: var(--text);
}
</style>
{% endblock %}
