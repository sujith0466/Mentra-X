{% extends "base.html" %}

{% block title %}Weekly AI Report | Mentra{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center mb-4">
        <div class="col-md-10 text-center">
            <h2 class="mb-2">Your Weekly AI Report</h2>
            <p class="text-secondary">A snapshot of your past 7 days of learning, coding, and progress.</p>
        </div>
    </div>

    <div class="row justify-content-center" id="reportContainer">
        <div class="col-md-10 text-center" id="reportLoader">
            <div class="spinner-border text-primary my-5" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Analyzing your week...</p>
        </div>
    </div>
</div>

<template id="reportTemplate">
    <div class="row g-4">
        <div class="col-12">
            <div class="card shadow-sm border-0 bg-primary text-white p-4">
                <h5 class="mb-3">Weekly Summary</h5>
                <p id="summaryText" class="lead mb-0"></p>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="card-title text-muted mb-4">Activity Breakdown</h5>
                    <ul class="list-group list-group-flush" id="activityList">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="card-title text-muted mb-4">Focus Areas</h5>
                    <div id="weakTopics"></div>
                    <hr>
                    <h6 class="mt-3 mb-2">Recommendations</h6>
                    <ul id="recsList" class="ps-3 mb-0 text-secondary"></ul>
                </div>
            </div>
        </div>
    </div>
</template>

<style>
.card { background-color: var(--surface); border-radius: 12px; }
.bg-primary { background-color: var(--primary) !important; }
.list-group-item { background-color: transparent; border-color: var(--border); color: var(--text); padding: 12px 0; }
.list-group { border-radius: 0; }
</style>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const res = await fetch("/api/weekly-report");
        const data = await res.json();
        
        document.getElementById("reportLoader").style.display = "none";
        
        if (data.success) {
            const tmpl = document.getElementById("reportTemplate").content.cloneNode(true);
            
            tmpl.getElementById("summaryText").innerText = data.summary || "No summary available.";
            
            // Activity List
            const actList = tmpl.getElementById("activityList");
            let lessons = data.lessons_completed || 0;
            let codeReqs = data.coding_activity?.challenges_attempted || 0;
            let codePass = data.coding_activity?.challenges_passed || 0;
            let quizReqs = data.quiz_activity?.quizzes_attempted || 0;
            
            actList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">Lessons Completed <span class="badge bg-primary rounded-pill">${lessons}</span></li>`;
            actList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">Coding Attempts <span class="badge bg-secondary rounded-pill">${codeReqs}</span></li>`;
            actList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">Coding Passed <span class="badge bg-success rounded-pill">${codePass}</span></li>`;
            actList.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center">Quizzes Attempted <span class="badge bg-info rounded-pill">${quizReqs}</span></li>`;
            
            // Weak Topics
            const weakDiv = tmpl.getElementById("weakTopics");
            if(data.weak_topics && data.weak_topics.length > 0) {
                weakDiv.innerHTML = data.weak_topics.map(t => `<span class="badge bg-danger me-2 mb-2 p-2">${t}</span>`).join("");
            } else {
                weakDiv.innerHTML = '<small class="text-success">No weak topics detected this week. You are excelling!</small>';
            }
            
            // Recommendations
            const reqList = tmpl.getElementById("recsList");
            (data.recommendations || []).forEach(r => {
                reqList.innerHTML += `<li><small>${r}</small></li>`;
            });
            
            document.getElementById("reportContainer").appendChild(tmpl);
        } else {
            document.getElementById("reportContainer").innerHTML = `<div class="col-12 text-center text-danger">Failed to load report.</div>`;
        }
    } catch(e) { console.error(e); }
});
</script>
{% endblock %}
