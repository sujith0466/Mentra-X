{% extends "base.html" %}

{% block title %}AI Doubt Solver | Mentra{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4 justify-content-center text-center">
        <div class="col-md-8">
            <h2 class="mb-2">AI Doubt Solver</h2>
            <p class="text-secondary">Stuck on a concept? Ask our AI instantly and get a detailed, rule-based explanation.</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <div class="input-group mb-3 d-flex" style="gap:10px;">
                    <input type="text" id="questionInput" class="form-control" placeholder="E.g., What is a Python list?" style="flex-grow:1;">
                    <button class="btn btn-primary w-25" id="askBtn" onclick="askDoubt()">Ask AI</button>
                </div>
            </div>
            
            <div id="answerCard" class="card shadow-sm border-0 p-4 mt-4" style="display: none; border-left: 5px solid var(--primary) !important;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0 text-primary">Explanation</h5>
                    <span class="badge bg-secondary" id="topicBadge">Topic</span>
                </div>
                <p id="answerText" class="lead fs-6" style="line-height: 1.6;"></p>
                <div class="mt-3 pt-3 border-top text-end">
                    <small class="text-muted">Generated instantly based on your syllabus.</small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.form-control { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px; }
.form-control:focus { outline: none; border-color: var(--primary); }
.btn-primary { background: var(--primary); border: none; color: white; border-radius: 8px; padding: 12px; cursor: pointer; white-space: nowrap; }
.card { background-color: var(--surface); border-radius: 12px; }
.badge { padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; }
.bg-secondary { background-color: var(--secondary); color: var(--surface); }
</style>

<script>
document.getElementById("questionInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") askDoubt();
});

async function askDoubt() {
    const q = document.getElementById("questionInput").value;
    if (!q.trim()) return;
    
    const btn = document.getElementById("askBtn");
    btn.innerText = "Thinking...";
    btn.disabled = true;
    
    try {
        const res = await fetch("/api/doubt-solver", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question_text: q})
        });
        const data = await res.json();
        
        if (data.success) {
            document.getElementById("topicBadge").innerText = data.topic;
            document.getElementById("answerText").innerText = data.explanation;
            document.getElementById("answerCard").style.display = "block";
        } else {
            alert(data.error || "An error occurred.");
        }
    } catch(e) {
        console.error(e);
        alert("Failed to reach AI Solver.");
    } finally {
        btn.innerText = "Ask AI";
        btn.disabled = false;
    }
}
</script>
{% endblock %}
