{% extends "base.html" %}

{% block title %}Start Mock Interview - Mentra{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="section-title-row">
        <h2>Start Mock Interview</h2>
    </div>
    <form method="POST" class="stack-form">
        <label for="role">Target Role</label>
        <select id="role" name="role">
            {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
            {% endfor %}
        </select>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" name="difficulty">
            {% for difficulty in difficulty_levels %}
            <option value="{{ difficulty }}">{{ difficulty }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-primary-soft">Start Interview</button>
    </form>
</section>

<style>
.stack-form { display: grid; gap: 12px; }
.stack-form select { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; }
</style>
{% endblock %}
