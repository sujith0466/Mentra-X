{% extends "base.html" %}

{% block title %}Login - Mentra{% endblock %}

{% block content %}
<div class="container">
    <section class="auth-section">
        <div class="auth-card">
            <h1 class="auth-brand">Mentra</h1>
            <p class="auth-tagline">Learn Smarter. Build Your Future.</p>
            <h2>Student/Admin Login</h2>
            
            <form method="POST" class="form">
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            
            <p class="auth-footer">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
            </p>
            
            <div class="demo-info">
                <h4>Demo Admin Credentials:</h4>
                <p><strong>Email:</strong> admin@eduportal.com</p>
                <p><strong>Password:</strong> admin123</p>
            </div>
        </div>
    </section>
</div>
<style>
.auth-brand { margin: 0 0 6px; text-align: center; font-size: 1.7rem; color: #0f172a; }
.auth-tagline { margin: 0 0 12px; text-align: center; color: #0f766e; font-weight: 600; }
</style>
{% endblock %}
