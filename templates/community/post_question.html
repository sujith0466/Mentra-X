{% extends "base.html" %}

{% block title %}Ask Community Question - Mentra{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="section-title-row">
        <h2>Ask the Community</h2>
    </div>
    <form method="POST" class="stack-form">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>
        <label for="content">Question</label>
        <textarea id="content" name="content" rows="8" required></textarea>
        <button type="submit" class="btn-primary-soft">Post Question</button>
    </form>
</section>

<style>
.stack-form { display: grid; gap: 12px; }
.stack-form input, .stack-form textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; }
</style>
{% endblock %}
