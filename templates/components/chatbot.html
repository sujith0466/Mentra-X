<div id="chatbot-widget" class="chatbot-widget">
    <button id="chatbot-toggle" class="chatbot-toggle" title="Open Mentra Assistant">
        <span class="chatbot-icon">M</span>
        <span class="chatbot-label">Mentra AI</span>
    </button>

    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chatbot-header">
            <div>
                <h3>Mentra Assistant</h3>
                <small id="chatbot-page-label">Rule-based mentor</small>
            </div>
            <div class="chatbot-header-actions">
                <button id="chatbot-clear" class="chatbot-clear" type="button" title="Clear chat" aria-label="Clear chat">Clear</button>
                <button id="chatbot-close" class="chatbot-close" title="Close" aria-label="Close assistant">&times;</button>
            </div>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <div class="chatbot-message bot-message">
                <div class="message-content">
                    Welcome to Mentra Assistant. I work fully offline with rule-based guidance and can answer based on your current page.
                </div>
                <div class="message-time">Just now</div>
            </div>
        </div>

        <div class="chatbot-starters" id="chatbot-starters"></div>

        <div class="chatbot-input-area">
            <form id="chatbot-form">
                <input
                    type="text"
                    id="chatbot-input"
                    class="chatbot-input"
                    placeholder="Ask about this page, course, or next steps..."
                    autocomplete="off"
                />
                <button type="submit" class="chatbot-send" title="Send">
                    <span>Send</span>
                </button>
            </form>
        </div>

        <div class="chatbot-footer">
            <small>Rule-based startup assistant • No external API dependency</small>
        </div>
    </div>
</div>

<style>
.chatbot-widget {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9999;
    font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
}
.chatbot-toggle {
    height: 58px;
    min-width: 58px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    color: #fff;
    background: linear-gradient(135deg, #1d4ed8, #0f766e);
    box-shadow: 0 14px 30px rgba(15, 23, 42, 0.28);
    transition: transform .2s ease, box-shadow .2s ease;
}
.chatbot-toggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 34px rgba(15, 23, 42, 0.33);
}
.chatbot-icon {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.2);
    font-weight: 800;
}
.chatbot-label {
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: .02em;
}
.chatbot-window {
    position: absolute;
    right: 0;
    bottom: 74px;
    width: 390px;
    height: 560px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: 0 24px 48px rgba(15, 23, 42, 0.24);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition: all .22s ease;
}
.chatbot-window.hidden {
    opacity: 0;
    visibility: hidden;
    transform: translateY(14px);
    pointer-events: none;
}
.chatbot-header {
    padding: 12px 14px;
    color: #fff;
    background: linear-gradient(135deg, #1d4ed8, #0f766e);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.chatbot-header h3 {
    margin: 0;
    font-size: 0.98rem;
}
.chatbot-header small {
    opacity: .95;
    font-weight: 600;
}
.chatbot-close {
    border: 0;
    background: none;
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}
.chatbot-header-actions {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.chatbot-clear {
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fff;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
}
.chatbot-clear:hover {
    background: rgba(255, 255, 255, 0.24);
}
.chatbot-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 9px;
}
.chatbot-message {
    max-width: 92%;
}
.bot-message .message-content,
.user-message .message-content {
    border-radius: 11px;
    padding: 10px 12px;
    font-size: 0.9rem;
    line-height: 1.55;
}
.bot-message .message-content {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
}
.user-message {
    margin-left: auto;
}
.user-message .message-content {
    background: linear-gradient(135deg, #1d4ed8, #0f766e);
    color: #fff;
}
.message-time {
    margin-top: 3px;
    font-size: 0.72rem;
    color: var(--secondary);
}
.user-message .message-time {
    text-align: right;
}
.chatbot-starters {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.starter-chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.77rem;
    font-weight: 700;
    cursor: pointer;
}
.starter-chip:hover {
    border-color: var(--primary);
    color: var(--primary);
}
.chatbot-input-area {
    border-top: 1px solid var(--border);
    padding: 10px;
    background: var(--surface);
}
#chatbot-form {
    display: flex;
    gap: 8px;
}
.chatbot-input {
    flex: 1;
    min-height: 40px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 13px;
    background: var(--surface);
    color: var(--text);
}
.chatbot-send {
    min-width: 72px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #1d4ed8, #0f766e);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
}
.chatbot-footer {
    border-top: 1px solid var(--border);
    padding: 7px 10px;
    text-align: center;
    color: var(--secondary);
    background: var(--surface-light);
}
.typing-indicator {
    display: inline-flex;
    gap: 4px;
}
.typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #1d4ed8;
    animation: typing 1.1s infinite;
}
.typing-dot:nth-child(2) { animation-delay: .15s; }
.typing-dot:nth-child(3) { animation-delay: .3s; }
@keyframes typing {
    0%, 60%, 100% { opacity: .35; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-5px); }
}
@media (max-width: 480px) {
    .chatbot-widget {
        right: 10px;
        bottom: 10px;
    }
    .chatbot-window {
        width: calc(100vw - 18px);
        right: -2px;
        height: 76vh;
    }
    .chatbot-toggle {
        padding: 0 12px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('chatbot-toggle');
    const chatWindow = document.getElementById('chatbot-window');
    const closeBtn = document.getElementById('chatbot-close');
    const clearBtn = document.getElementById('chatbot-clear');
    const chatForm = document.getElementById('chatbot-form');
    const chatInput = document.getElementById('chatbot-input');
    const messagesContainer = document.getElementById('chatbot-messages');
    const startersWrap = document.getElementById('chatbot-starters');
    const pageLabel = document.getElementById('chatbot-page-label');

    if (!toggleBtn || !chatWindow || !closeBtn || !chatForm || !chatInput || !messagesContainer || !startersWrap || !pageLabel || !clearBtn) {
        return;
    }

    const context = getPageContext();
    pageLabel.textContent = 'Rule-based mentor';
    setStarterPrompts(context.currentPage);
    restoreMessages();

    toggleBtn.addEventListener('click', () => {
        chatWindow.classList.toggle('hidden');
        if (!chatWindow.classList.contains('hidden')) {
            chatInput.focus();
        }
    });

    closeBtn.addEventListener('click', () => {
        chatWindow.classList.add('hidden');
    });
    clearBtn.addEventListener('click', () => {
        clearMessages();
    });

    chatForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = chatInput.value.trim();
        if (!message) return;

        addMessage(message, 'user');
        chatInput.value = '';
        showTypingIndicator();

        try {
            const response = await fetch('/api/chatbot/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: message,
                    context: {
                        page: context.currentPage,
                        course: context.courseName,
                        course_id: context.courseId,
                        domain: context.domain,
                        path: context.path
                    }
                })
            });

            const payload = await response.json();
            removeTypingIndicator();

            const answer =
                payload.answer ||
                payload.response ||
                (payload.data && payload.data.answer) ||
                'I could not generate a response right now.';
            addMessage(answer, 'bot');

            const options =
                payload.options ||
                payload.suggestions ||
                (payload.data && (payload.data.options || payload.data.suggestions)) ||
                [];
            if (Array.isArray(options) && options.length > 0) {
                setStarterPrompts(context.currentPage, options.slice(0, 4));
            }
            persistMessages();
        } catch (error) {
            console.error('Chatbot error:', error);
            removeTypingIndicator();
            addMessage('Assistant is temporarily unavailable. Please try again.', 'bot');
            persistMessages();
        }
    });

    function getStarterMap() {
        return {
            homepage: [
                'Which course should I start with?',
                'Show beginner friendly tracks',
                'How do certificates work?'
            ],
            courses: [
                'How do I choose the right domain?',
                'Recommend a beginner course',
                'Which courses include projects?'
            ],
            course: [
                'What should I learn first here?',
                'How do quizzes help in this course?',
                'What project can I build next?'
            ],
            dashboard: [
                'How can I improve my progress?',
                'Recommend my next course',
                'How do I build a portfolio?'
            ],
            contact: [
                'How can I report a technical issue?',
                'How soon will support reply?',
                'I need enrollment help'
            ],
            about: [
                'What makes Mentra different?',
                'How does Mentra learning model work?',
                'How do referral rewards work?'
            ],
            general: [
                'Give me study tips',
                'How do I practice coding?',
                'Help me with career roadmap'
            ]
        };
    }

    function setStarterPrompts(page, options) {
        const map = getStarterMap();
        const prompts = Array.isArray(options) && options.length > 0
            ? options
            : (map[page] || map.general);
        startersWrap.innerHTML = '';
        prompts.slice(0, 4).forEach((prompt) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'starter-chip';
            chip.textContent = prompt;
            chip.addEventListener('click', () => {
                chatInput.value = prompt;
                chatForm.dispatchEvent(new Event('submit'));
            });
            startersWrap.appendChild(chip);
        });
    }

    function addMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `chatbot-message ${sender}-message`;
        const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        wrapper.innerHTML = `
            <div class="message-content">${formatMessage(text)}</div>
            <div class="message-time">${stamp}</div>
        `;
        messagesContainer.appendChild(wrapper);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        persistMessages();
    }

    function formatMessage(text) {
        const escaped = escapeHtml(String(text || ''));
        const lines = escaped.split('\n');
        const out = [];
        let inList = false;
        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('- ')) {
                if (!inList) {
                    out.push('<ul>');
                    inList = true;
                }
                out.push(`<li>${trimmed.substring(2)}</li>`);
            } else {
                if (inList) {
                    out.push('</ul>');
                    inList = false;
                }
                if (trimmed) {
                    out.push(`<p>${trimmed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`);
                }
            }
        });
        if (inList) out.push('</ul>');
        return out.join('');
    }

    function showTypingIndicator() {
        const holder = document.createElement('div');
        holder.id = 'typing-indicator';
        holder.className = 'chatbot-message bot-message';
        holder.innerHTML = `
            <div class="message-content">
                <span class="typing-indicator">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </span>
            </div>
        `;
        messagesContainer.appendChild(holder);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTypingIndicator() {
        const node = document.getElementById('typing-indicator');
        if (node) node.remove();
    }

    function storageKey() {
        return `mentra_chatbot_history:${context.currentPage}`;
    }

    function restoreMessages() {
        try {
            const raw = sessionStorage.getItem(storageKey());
            if (!raw) return;
            const history = JSON.parse(raw);
            if (!Array.isArray(history) || history.length === 0) return;
            messagesContainer.innerHTML = '';
            history.slice(-30).forEach((item) => {
                const sender = item.sender === 'user' ? 'user' : 'bot';
                const text = String(item.text || '');
                if (!text) return;
                const wrapper = document.createElement('div');
                wrapper.className = `chatbot-message ${sender}-message`;
                wrapper.innerHTML = `
                    <div class="message-content">${formatMessage(text)}</div>
                    <div class="message-time">${item.time || 'Just now'}</div>
                `;
                messagesContainer.appendChild(wrapper);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } catch (err) {
            console.warn('Could not restore chatbot history:', err);
        }
    }

    function persistMessages() {
        try {
            const items = Array.from(messagesContainer.querySelectorAll('.chatbot-message'));
            const history = items
                .filter((node) => !node.id || node.id !== 'typing-indicator')
                .map((node) => {
                    const isUser = node.classList.contains('user-message');
                    const contentNode = node.querySelector('.message-content');
                    const timeNode = node.querySelector('.message-time');
                    return {
                        sender: isUser ? 'user' : 'bot',
                        text: contentNode ? (contentNode.textContent || '').trim() : '',
                        time: timeNode ? (timeNode.textContent || '').trim() : ''
                    };
                })
                .filter((row) => row.text);
            sessionStorage.setItem(storageKey(), JSON.stringify(history.slice(-30)));
        } catch (err) {
            console.warn('Could not persist chatbot history:', err);
        }
    }

    function clearMessages() {
        messagesContainer.innerHTML = '';
        addMessage('Chat cleared. Ask me anything about this page, your progress, or your next learning step.', 'bot');
        sessionStorage.removeItem(storageKey());
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function detectCurrentPage(path) {
        const value = (path || '').toLowerCase();
        if (value === '/' || value.includes('/index')) return 'homepage';
        if (value.includes('/courses')) return 'courses';
        if (value.includes('/course/')) return 'course';
        if (value.includes('/dashboard')) return 'dashboard';
        if (value.includes('/contact')) return 'contact';
        if (value.includes('/about')) return 'about';
        return 'general';
    }

    function getPageContext() {
        const path = window.location.pathname || '/';
        const page = detectCurrentPage(path);

        let courseId = null;
        const courseIdMatch = path.match(/\/course\/(\d+)/i);
        if (courseIdMatch) {
            courseId = Number(courseIdMatch[1]);
        }

        const heading = document.querySelector('h1');
        const courseName = heading ? heading.textContent.trim() : null;

        const domainBadge = document.querySelector('.domain-pill, .course-domain-badge, [data-domain]');
        const domain = domainBadge ? (domainBadge.textContent || domainBadge.getAttribute('data-domain') || '').trim() : null;

        return {
            currentPage: page,
            courseId: courseId,
            courseName: courseName,
            domain: domain,
            path: path
        };
    }

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !chatWindow.classList.contains('hidden')) {
            chatWindow.classList.add('hidden');
        }
    });
});
</script>
