{% extends "base.html" %}
{% block title %}Quiz Management - Mentra{% endblock %}
{% block content %}
<div class="container">
    <h1>Quiz Management</h1>
    <p>Select a course to manage quizzes.</p>
    <div class="admin-table-wrap">
        <table class="admin-table">
            <thead><tr><th>Course</th><th>Actions</th></tr></thead>
            <tbody>
            {% for course in courses %}
                <tr>
                    <td>{{ course.title }}</td>
                    <td><a class="btn btn-primary btn-sm" href="{{ url_for('admin_quiz.manage_course_quizzes', course_id=course.id) }}">Manage Quizzes</a></td>
                </tr>
            {% else %}
                <tr><td colspan="2">No courses found.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
