{% extends "base.html" %}

{% block title %}Edit Admin - Mentra{% endblock %}

{% block content %}
<div class="container">
    <section class="admin-edit">
        <h1>Edit Admin User</h1>
        
        <form method="POST" class="form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" value="{{ admin_user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password" placeholder="Leave blank to keep current password">
            </div>
            
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ admin_user.full_name or '' }}">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ admin_user.email or '' }}">
            </div>
            
            <div class="form-group">
                <label for="admin_role">Admin Role *</label>
                <select id="admin_role" name="admin_role" required>
                    {% for role in admin_roles %}
                    <option value="{{ role }}" {% if admin_user.role == role %}selected{% endif %}>{{ role.replace('_', ' ')|title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Admin</button>
                <a href="{{ url_for('admin.manage_admins') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
