{% extends "base.html" %}

{% block title %}Edit Admin - Education Portal{% endblock %}

{% block content %}
<div class="container">
    <section class="admin-edit">
        <h1>Edit Admin User</h1>
        
        <form method="POST" class="form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" value="{{ admin_user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password" placeholder="Leave blank to keep current password">
            </div>
            
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ admin_user.full_name or '' }}">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ admin_user.email or '' }}">
            </div>
            
            <div class="form-group">
                <label for="admin_role">Admin Role *</label>
                <select id="admin_role" name="admin_role" required>
                    {% for role in admin_roles %}
                    <option value="{{ role }}" {% if admin_user.role == role %}selected{% endif %}>{{ role.replace('_', ' ')|title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Admin</button>
                <a href="{{ url_for('admin.manage_admins') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</div>

<style>
    .admin-edit {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 500px;
        margin: 40px auto;
    }

    .form {
        margin-top: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .form-group input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-color, #4f46e5);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 30px;
    }

    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        font-weight: 500;
    }

    .btn-primary {
        background: var(--primary-color, #4f46e5);
        color: white;
        flex: 1;
    }

    .btn-primary:hover {
        background: #4338ca;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .btn-secondary {
        background: #f0f0f0;
        color: #333;
        flex: 1;
        border: 1px solid #ddd;
    }

    .btn-secondary:hover {
        background: #e0e0e0;
    }
</style>
{% endblock %}
