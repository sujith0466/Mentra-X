{% extends "base.html" %}

{% block title %}Mock Interview System{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 class="mb-4">AI Mock Interview System</h1>
            <p class="lead mb-4">Select your target role and get dynamic questions evaluated by our AI.</p>
            
            <div class="card shadow-sm p-4">
                <form id="startInterviewForm">
                    <div class="mb-3">
                        <label for="roleSelect" class="form-label" style="font-weight: 600;">Target Role</label>
                        <select class="form-select form-select-lg" id="roleSelect" required>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="ai">AI Engineer</option>
                            <option value="data science">Data Scientist</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="startBtn">
                        Start Interview
                    </button>
                    
                    <div id="loadingIndicator" class="mt-3 d-none">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Generating questions...</p>
                    </div>
                    
                    <div id="errorAlert" class="alert alert-danger mt-3 d-none"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('startInterviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('startBtn');
    const loading = document.getElementById('loadingIndicator');
    const errorAlert = document.getElementById('errorAlert');
    
    // UI Loading state
    btn.disabled = true;
    loading.classList.remove('d-none');
    errorAlert.classList.add('d-none');
    
    const role = document.getElementById('roleSelect').value;
    
    try {
        const response = await fetch('/api/interview/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: role })
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            // Store details in session storage
            sessionStorage.setItem('interview_questions', JSON.stringify(data.questions));
            sessionStorage.setItem('interview_total', data.total_questions);
            sessionStorage.setItem('interview_current_index', '0');
            
            // Redirect to interview flow
            window.location.href = 'interview.html';
        } else {
            errorAlert.innerText = data.message || "Failed to start interview.";
            errorAlert.classList.remove('d-none');
            btn.disabled = false;
        }
    } catch (err) {
        errorAlert.innerText = "Network error occurred.";
        errorAlert.classList.remove('d-none');
        btn.disabled = false;
    } finally {
        loading.classList.add('d-none');
    }
});
</script>
{% endblock %}
