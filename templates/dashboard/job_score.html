{% extends "base.html" %}

{% block title %}Job Readiness | Mentra{% endblock %}

{% block content %}
<div class="container job-dashboard">
    <h2 class="mb-4">Your Job Readiness</h2>

    <div class="score-card">
        <h1 id="scoreValue">--%</h1>
        <p>Overall Score</p>
    </div>

    <div class="breakdown-grid">
        <div class="breakdown-card">
            <h4>Resume</h4>
            <div class="bar"><div id="resumeBar"></div></div>
            <span id="resumeScore">--/25</span>
        </div>

        <div class="breakdown-card">
            <h4>Courses</h4>
            <div class="bar"><div id="coursesBar"></div></div>
            <span id="coursesScore">--/25</span>
        </div>

        <div class="breakdown-card">
            <h4>Coding</h4>
            <div class="bar"><div id="codingBar"></div></div>
            <span id="codingScore">--/25</span>
        </div>

        <div class="breakdown-card">
            <h4>Projects</h4>
            <div class="bar"><div id="projectsBar"></div></div>
            <span id="projectsScore">--/25</span>
        </div>
    </div>

    <div class="suggestions-card">
        <h4>How to Improve</h4>
        <ul id="suggestionsList"></ul>
    </div>
</div>

<script>
async function loadScore() {
  try {
    const res = await fetch("/api/job-score");
    if (!res.ok) {
      throw new Error("Unable to load job score.");
    }

    const data = await res.json();

    document.getElementById("scoreValue").innerText = (data.score ?? 0) + "%";

    const resume = Number(data?.breakdown?.resume || 0);
    const courses = Number(data?.breakdown?.courses || 0);
    const coding = Number(data?.breakdown?.coding || 0);
    const projects = Number(data?.breakdown?.projects || 0);

    document.getElementById("resumeBar").style.width = (resume * 4) + "%";
    document.getElementById("coursesBar").style.width = (courses * 4) + "%";
    document.getElementById("codingBar").style.width = (coding * 4) + "%";
    document.getElementById("projectsBar").style.width = (projects * 4) + "%";

    document.getElementById("resumeScore").innerText = resume + "/25";
    document.getElementById("coursesScore").innerText = courses + "/25";
    document.getElementById("codingScore").innerText = coding + "/25";
    document.getElementById("projectsScore").innerText = projects + "/25";

    const list = document.getElementById("suggestionsList");
    list.innerHTML = "";

    if (Array.isArray(data.suggestions) && data.suggestions.length) {
      data.suggestions.forEach((suggestion) => {
        const li = document.createElement("li");
        li.innerText = suggestion;
        list.appendChild(li);
      });
    } else {
      const li = document.createElement("li");
      li.innerText = "Keep building consistency across resume, courses, coding, and projects.";
      list.appendChild(li);
    }
  } catch (err) {
    const list = document.getElementById("suggestionsList");
    list.innerHTML = "";
    const li = document.createElement("li");
    li.innerText = "Could not load your score right now. Please try again shortly.";
    list.appendChild(li);
  }
}

loadScore();
</script>
{% endblock %}
